name: Prisma and database security checks

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/**"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - ".github/workflows/prisma-check.yml"
  push:
    branches: [mission-20-supabase-prisma]
    paths:
      - "prisma/**"
      - "prisma.config.ts"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - ".github/workflows/prisma-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boutiquepro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boutiquepro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/boutiquepro_test
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/boutiquepro_test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Prepare Supabase Auth test roles
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          SQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boutiquepro_test
      - name: Apply database migrations to clean PostgreSQL
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261105080000_initial_schema/migration.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261105090000_enable_tenant_rls/migration.sql
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boutiquepro_test
      - name: Verify cross-tenant RLS isolation
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/tests/rls-smoke.sql
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boutiquepro_test
